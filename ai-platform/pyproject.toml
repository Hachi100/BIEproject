[project]
name = "bie-ai-platform"
version = "0.1.0"
description = "Plateforme IA de Budget Intelligence Engine : import intelligent des PTAB, puis assistance (suggestions, RAG)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
bie-import-ptab = "bie_ai.ptab_import.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bie_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# le formateur gère la longueur du code ; les messages en français restent sur une ligne
ignore = ["E501"]
