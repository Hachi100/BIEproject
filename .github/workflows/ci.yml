name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Cœur métier (Kotlin / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (unitaires + intégration PostgreSQL via Testcontainers)
        run: ./gradlew test --console=plain
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: backend/build/reports/tests/test

  ai-platform:
    name: Plateforme IA (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest
