# Environnement de développement local de BIE.
# Incrément 1 : PostgreSQL (source de vérité transactionnelle).
# Les autres briques de l'architecture cible (Keycloak, Qdrant, MinIO/S3, Temporal)
# sont prêtes à être activées avec le profil « complet » :
#   docker compose --profile complet up -d
name: bie

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bie
      POSTGRES_USER: bie
      POSTGRES_PASSWORD: bie
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bie -d bie"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    profiles: ["complet"]
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  qdrant:
    profiles: ["complet"]
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    profiles: ["complet"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bie
      MINIO_ROOT_PASSWORD: bie-secret-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  temporal:
    profiles: ["complet"]
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
